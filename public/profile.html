<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile - Dirty Hub</title>
<style>
body{margin:0;background:#0f0f14;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:500px;background:#191920;padding:30px;border-radius:20px}
h1{margin-top:0}
p{color:#999}
label{display:block;margin-top:18px}
input,textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:13px;border-radius:10px;border:1px solid #333;background:#111;color:white}
textarea{height:100px;resize:none}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#7655ff;color:white;font-weight:bold;font-size:16px;cursor:pointer}
.photo{width:90px;height:90px;border-radius:50%;background:#292930;display:flex;align-items:center;justify-content:center;font-size:35px;overflow:hidden;margin-bottom:10px}
.photo img{width:100%;height:100%;object-fit:cover}
#photo{display:none}
.upload{display:inline-block;background:white;color:#111;padding:10px 15px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<div class="card">
<h1>Create your profile</h1>
<p>Tell people a little about yourself.</p>

<div class="photo" id="avatar">👤</div>

<label for="photo" class="upload">Upload photo</label>
<input type="file" id="photo" accept="image/*">

<label>Name</label>
<input id="name" placeholder="Your name" maxlength="50">

<label>Username</label>
<input id="username" placeholder="@username" maxlength="30">

<label>Bio</label>
<textarea id="bio" placeholder="Tell people about yourself..." maxlength="160"></textarea>

<button onclick="createProfile()">Create Profile</button>
</div>

<script>
document.getElementById("photo").addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(){
document.getElementById("avatar").innerHTML='<img src="'+reader.result+'">';
};
reader.readAsDataURL(file);
});

function createProfile(){
const name=document.getElementById("name").value.trim();
const username=document.getElementById("username").value.trim();
const bio=document.getElementById("bio").value.trim();

if(!name||!username){
alert("Please enter your name and username.");
return;
}

const profile={
name:name,
username:username,
bio:bio,
photo:document.querySelector("#avatar img")?.src||""
};

localStorage.setItem("dirtyHubProfile",JSON.stringify(profile));
alert("Profile created successfully!");
}
</script>

</body>
</html>
